######################################################################
# Chamber light
######################################################################
# The chamber light is wired to a GPIO of the printer's Linux board, not to the
# MCU, so Klipper can't drive it as a real pin. This virtual pin gives Mainsail,
# Fluidd and touch screens an ordinary light switch that knows its state.
# SET_PIN is wrapped to pass each change on to Moonraker's "chamber_light"
# power device (provided by Rinkhals), which switches the GPIO.
#
# The last setting is kept in [save_variables] and applied again when Klipper
# starts, so the switch always shows what the light is really doing.

# Also declared in the ACE config. Repeated here so this file works wherever it
# is included, and without the ACE config.
[virtual_pins]

[output_pin chamber_light]
pin: virtual_pin:chamber_light
pwm: False
value: 1

[gcode_macro SET_PIN]
rename_existing: SET_PIN_BASE
gcode:
    SET_PIN_BASE {rawparams}
    {% if params.PIN|default("")|lower == "chamber_light" %}
        {% set on = params.VALUE|default(0)|float > 0 %}
        {action_call_remote_method("set_device_power", device="chamber_light", state="on" if on else "off")}
        {% if printer.save_variables is defined %}
            SAVE_VARIABLE VARIABLE=chamber_light VALUE={1 if on else 0}
        {% endif %}
    {% endif %}

[delayed_gcode _CHAMBER_LIGHT_RESTORE]
initial_duration: 5
gcode:
    {% set saved = (printer.save_variables.variables.chamber_light|default(1)) if printer.save_variables is defined else 1 %}
    SET_PIN PIN=chamber_light VALUE={saved}
