######################################################################
# HelixScreen: a button to go back to Anycubic's screen
######################################################################
# Installed by the HelixScreen app, and replaced every time it starts.
#
# ANYCUBIC_SCREEN shows up in HelixScreen's macro list, and can be put on its
# home screen as a macro button. A Klipper macro can't run a program, so all
# it does is save a count with SAVE_VARIABLE. That writes a file on the
# printer, which the HelixScreen app watches: when the count goes up, it stops
# HelixScreen and brings Anycubic's screen back.
#
# To return to HelixScreen, start the app again: on the printer under
# Settings > Rinkhals > Apps > HelixScreen, or from the Rinkhals web portal.

[gcode_macro ANYCUBIC_SCREEN]
description: Switch the printer's screen back to Anycubic's interface
gcode:
    {% if printer.save_variables is defined %}
        {% set count = printer.save_variables.variables.helixscreen_anycubic_screen|default(0)|int %}
        SAVE_VARIABLE VARIABLE=helixscreen_anycubic_screen VALUE={count + 1}
        {action_respond_info("Switching to Anycubic's screen. Start the HelixScreen app again to come back.")}
    {% else %}
        {action_respond_info("ANYCUBIC_SCREEN needs [save_variables] in the Klipper config. Stop the HelixScreen app from the Rinkhals web portal instead.")}
    {% endif %}
